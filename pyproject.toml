[project]
name = "ecg"
version = "0.1.0"
description = "Project to classify ECG data"
readme = "README.md"
authors = [
    { name = "Janina Kloos", email = "janina.kloos@fau.de" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "scikit-learn>=1.6.1",
    "wfdb>=4.3.1",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.17.0",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
